services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/Cataract_Detection
      - SECRET_KEY=${SECRET_KEY:-your-production-secret-key}
      - UPLOAD_DIR=/app/uploads
    depends_on:
      - mongodb
    volumes:
      - uploads:/app/uploads

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  uploads:
  mongodb_data:
